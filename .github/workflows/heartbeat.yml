name: News Heartbeat

# [2026-08-25 전면 재설계] 저장소 Private 전환에 따른 Actions 분(minute) 과금 대응.
#
# 배경: 이전 설계는 `timeout-minutes: 330`짜리 상주 잡을 띄우고 내부에서 `sleep 180`으로
#   3분 루프를 돌렸다. Public 저장소는 Actions 분이 무제한이라 문제가 없었으나,
#   개인정보 보호를 위해 Private으로 전환하면서 무료 한도(2,000분/월)가 적용됐다.
#   24시간 상주 = 1,440분/일 → 약 1.4일 만에 월 한도를 소진하고 전체 잡이 중단됐다.
#     ("The job was not started because recent account payments have failed
#       or your spending limit needs to be increased")
#
# 재설계: 상주 루프를 폐기하고 cron 기반 '단발 실행'으로 전환한다.
#   - 실행 창: KST 07:00~23:00 (UTC 22:00~13:59), 30분 주기 → 하루 32회
#   - 예상 소모: 32회 × 약 1.5분 × 30일 ≈ 1,440분/월 (한도 대비 약 25% 여유)
#   - 심야(KST 00~07시)는 기사 발생이 적고 로컬 앱도 꺼져 있어 제외
#   - 의존성은 수집에 필요한 4개만 설치(streamlit/openai/plotly 제외)해 회당 시간 단축
#
# [트리거 역할 분담 — 2026-08-26 정정]
#   주 트리거는 여전히 외부 cron-job.org(workflow_dispatch)다.
#   GitHub schedule은 드랍이 잦아 단독으로는 신뢰할 수 없다.
#   (2026-08-07 실측: 5시간 연속 무발화 → 8시간 뉴스 침묵 사고. 그래서 외부 cron을 도입했었음)
#
#   따라서 외부 cron을 없애지 않고 '주기만' 낮춰 한도에 맞춘다:
#     - cron-job.org : 30분 주기, KST 07:00~23:00 → 하루 약 32회  (주 트리거)
#     - GitHub cron  : 6시간 주기 → 하루 4회                      (외부 cron 장애 시 백스톱)
#   합계 약 36회/일 × 1.5분 ≈ 1,620분/월 (한도 2,000분의 약 81%)
#
#   ※ 외부 cron을 15분 주기로 되돌리면 하루 96회 = 월 4,300분으로 한도를 다시 초과한다.

on:
  schedule:
    # 백스톱 전용: 외부 트리거가 죽었을 때 최대 6시간 내 자동 복구
    # (UTC 0,6,12,18시 = KST 09,15,21,03시)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

# 단발 실행이므로 중복 트리거는 최신 것만 남긴다(대기열 적체로 분 낭비 방지).
concurrency:
  group: news-heartbeat
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # 행(hang) 시 분 낭비를 막는 상한
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (수집 전용 최소 설치)
        run: |
          pip install --upgrade pip
          pip install requests pandas python-dotenv beautifulsoup4

      - name: Collect news and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set +e

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # git 네트워크가 느려질 때 무한 대기 방지 (분 낭비 차단)
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=20

          merge_and_push() {
            for i in 1 2 3; do
              echo "Push attempt $i..."
              timeout 60 git fetch origin main || { echo "fetch timeout/실패"; sleep $((i*5)); continue; }

              if ! timeout 60 git rebase origin/main; then
                echo "Rebase failed (attempt $i), aborting and retrying..."
                git rebase --abort 2>/dev/null || true
                sleep $((i * 5))
                continue
              fi

              # sent_cache / pending_queue는 다른 워크플로와 union 병합 (발송이력 유실 방지)
              timeout 60 python3 scripts/merge_cache.py || echo "merge_cache 스킵"
              git add data/sent_articles_cache.json data/pending_articles.json 2>/dev/null || true
              git diff --staged --quiet || git commit --amend --no-edit

              if timeout 60 git push; then
                echo "Push successful!"
                return 0
              else
                echo "Push failed/timeout (attempt $i), retrying in 5 seconds..."
                sleep 5
              fi
            done
            echo "Push failed after 3 attempts - 다음 실행에서 재시도"
            return 1
          }

          echo "[HEARTBEAT] 단발 수집 시작 ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"

          # 최신 뉴스 CSV만 remote로 갱신 (sent_cache는 덮어쓰지 않음 → 재발송 방지)
          timeout 60 git fetch origin main -q || echo "fetch timeout/실패 - 로컬로 진행"
          git checkout origin/main -- data/news_monitor.csv 2>/dev/null || echo "csv sync skipped"

          # 수집 + 텔레그램 발송 + 로컬 CSV 저장
          timeout 240 python standalone_monitor.py || echo "[HEARTBEAT] monitor 오류/타임아웃($?)"

          # 변경분이 있을 때만 커밋·push
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "auto(heartbeat): $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
            merge_and_push
          else
            echo "[HEARTBEAT] 변경 없음 - 커밋 스킵"
          fi

          echo "[HEARTBEAT] 완료"
